<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Тренировки</title>
<meta name="theme-color" content="#0b0c0f">
<meta name="color-scheme" content="dark">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Тренировки">
<link rel="manifest" href="./manifest.webmanifest">
<link rel="icon" href="./icon-192.png">
<link rel="apple-touch-icon" href="./apple-touch-icon.png">
<style>
:root {
  --bg: #0b0c0f;
  --surface: #15171c;
  --surface-2: #1d2027;
  --line: #2a2e37;
  --text: #eef0f4;
  --muted: #8b92a1;
  --accent: #c6f432;
  --accent-dim: rgba(198, 244, 50, .12);
  --on-accent: #0b0c0f;
  --danger: #ff6b6b;
  --radius: 18px;
  --safe-b: env(safe-area-inset-bottom, 0px);
  --safe-t: env(safe-area-inset-top, 0px);
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html { background: var(--bg); }
body {
  margin: 0;
  background: var(--bg);
  color: var(--text);
  font: 16px/1.4 -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", Roboto, sans-serif;
  -webkit-font-smoothing: antialiased;
  overscroll-behavior-y: none;
}
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; border: 0; background: none; padding: 0; touch-action: manipulation; }
[hidden] { display: none !important; }

#app {
  max-width: 560px;
  margin: 0 auto;
  padding: calc(var(--safe-t) + 12px) 16px calc(var(--safe-b) + 170px);
}

/* ---------- top ---------- */
.date { color: var(--muted); font-size: 14px; }
.date::first-letter { text-transform: uppercase; }
h1 { margin: 2px 0 14px; font-size: 30px; letter-spacing: -.02em; font-weight: 800; }
.sticky {
  position: sticky; top: 0; z-index: 5;
  margin: 0 -16px; padding: calc(var(--safe-t) + 8px) 16px 10px;
  background: linear-gradient(var(--bg) 85%, transparent);
}
.seg {
  display: flex; gap: 4px; padding: 4px;
  background: var(--surface); border: 1px solid var(--line); border-radius: 14px;
}
.seg button {
  flex: 1; min-height: 40px; padding: 0 12px; border-radius: 10px;
  color: var(--muted); font-weight: 600; font-size: 15px;
  transition: background .2s, color .2s;
}
.seg button[aria-pressed="true"] { background: var(--accent); color: var(--on-accent); }
.seg.small { border-radius: 12px; }
.seg.small button { min-height: 36px; font-size: 14px; border-radius: 8px; }
.seg.small button[aria-pressed="true"] { background: var(--surface-2); color: var(--accent); box-shadow: inset 0 0 0 1px var(--line); }

.progress { margin-top: 12px; height: 6px; background: var(--surface-2); border-radius: 99px; overflow: hidden; }
.progress > div { height: 100%; background: var(--accent); border-radius: 99px; transition: width .35s ease; }
.progress-label { margin-top: 6px; font-size: 13px; color: var(--muted); font-variant-numeric: tabular-nums; }

/* ---------- cards ---------- */
.card {
  position: relative;
  margin-top: 12px; padding: 16px;
  background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius);
  transition: border-color .25s;
}
.card.complete { border-color: rgba(198, 244, 50, .45); }
.card-head { display: flex; gap: 12px; align-items: flex-start; }
.num {
  flex: none; width: 30px; height: 30px; border-radius: 10px;
  display: grid; place-items: center;
  background: var(--surface-2); color: var(--muted); font-weight: 700; font-size: 14px;
  transition: background .25s, color .25s;
}
.card.complete .num { background: var(--accent); color: var(--on-accent); }
.card-title { flex: 1; min-width: 0; }
.card-title h2 { margin: 2px 0 0; font-size: 18px; line-height: 1.25; font-weight: 700; overflow-wrap: anywhere; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; }
.chip {
  padding: 3px 10px; border-radius: 99px; font-size: 13px; font-weight: 600;
  background: var(--accent-dim); color: var(--accent); font-variant-numeric: tabular-nums;
}
.chip.ghost { background: var(--surface-2); color: var(--muted); }
.note { margin: 10px 0 0; color: var(--muted); font-size: 14px; }
.last { margin: 10px 0 0; font-size: 13px; color: var(--muted); font-variant-numeric: tabular-nums; }
.last b { color: var(--text); font-weight: 600; }
.card .seg { margin-top: 12px; }

.sets { margin-top: 12px; display: grid; gap: 8px; }
.set { display: grid; grid-template-columns: 22px 1fr 14px 1fr 48px; gap: 8px; align-items: center; }
.set.body { grid-template-columns: 22px 1fr 48px; }
.set-n { color: var(--muted); font-size: 14px; font-weight: 600; text-align: center; }
.x { color: var(--muted); text-align: center; }
.field {
  display: flex; align-items: center; gap: 4px; min-width: 0;
  height: 48px; padding: 0 12px;
  background: var(--surface-2); border: 1px solid transparent; border-radius: 12px;
  transition: border-color .2s;
}
.field:focus-within { border-color: var(--accent); }
.field input {
  flex: 1; min-width: 0; width: 100%;
  background: none; border: 0; outline: 0; padding: 0;
  font-size: 19px; font-weight: 700; font-variant-numeric: tabular-nums;
}
.field input::placeholder { color: #4d5361; font-weight: 600; }
.field span { color: var(--muted); font-size: 12px; white-space: nowrap; }
.check {
  width: 48px; height: 48px; border-radius: 12px;
  background: var(--surface-2); color: #4d5361;
  display: grid; place-items: center;
  transition: background .2s, color .2s, transform .1s;
}
.check:active { transform: scale(.92); }
.check svg { width: 22px; height: 22px; }
.set.done .check { background: var(--accent); color: var(--on-accent); }
.set.done .field { background: var(--accent-dim); }
.set.done .field input { color: var(--accent); }
.set-tools { display: flex; gap: 16px; margin-top: 10px; }
.link { color: var(--muted); font-size: 14px; font-weight: 600; min-height: 32px; }
.link:active { color: var(--text); }
.link.danger { color: var(--danger); }

.primary {
  display: block; width: 100%; min-height: 54px; margin-top: 20px;
  border-radius: 16px; background: var(--accent); color: var(--on-accent);
  font-weight: 800; font-size: 17px;
  transition: transform .1s, opacity .2s;
}
.primary:active { transform: scale(.985); }
.secondary {
  display: block; width: 100%; min-height: 48px; margin-top: 10px;
  border-radius: 14px; background: var(--surface-2); border: 1px solid var(--line);
  font-weight: 600;
}
.secondary.danger { color: var(--danger); }

.banner {
  display: flex; gap: 12px; align-items: flex-start;
  margin-bottom: 14px; padding: 12px 14px;
  background: var(--accent-dim); border-radius: 14px; font-size: 14px;
}
.banner p { margin: 0; flex: 1; }
.banner button { color: var(--muted); font-size: 20px; line-height: 1; min-width: 28px; min-height: 28px; }

/* ---------- history ---------- */
.empty { margin-top: 60px; text-align: center; color: var(--muted); }
.empty .big { font-size: 44px; margin-bottom: 8px; }
.h-head { display: flex; justify-content: space-between; gap: 12px; align-items: baseline; }
.h-head h2 { margin: 0; font-size: 18px; }
.h-meta { color: var(--muted); font-size: 13px; margin-top: 2px; }
.h-list { margin: 12px 0 0; padding: 0; list-style: none; display: grid; gap: 8px; }
.h-list li { font-size: 14px; }
.h-list .n { font-weight: 600; }
.h-list .e { color: var(--muted); }
.h-list .s { color: var(--accent); font-variant-numeric: tabular-nums; }

/* ---------- settings ---------- */
h3 { margin: 26px 0 0; font-size: 13px; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); }
.row {
  display: flex; align-items: center; gap: 10px;
  padding: 10px 0; border-bottom: 1px solid var(--line);
}
.row:last-child { border-bottom: 0; }
.row-main { flex: 1; min-width: 0; text-align: left; min-height: 44px; }
.row-main .t { font-weight: 600; overflow-wrap: anywhere; }
.row-main .d { color: var(--muted); font-size: 13px; }
.icon-btn {
  flex: none; width: 36px; height: 36px; border-radius: 10px;
  background: var(--surface-2); color: var(--muted); font-size: 16px;
}
.icon-btn:disabled { opacity: .3; }
.icon-btn { display: grid; place-items: center; }
.icon-btn svg { width: 18px; height: 18px; }
.tip {
  display: block; width: 100%; margin-top: 10px; padding: 10px 12px; min-height: 44px;
  border-radius: 12px; background: var(--accent-dim); border: 1px dashed rgba(198, 244, 50, .4);
  color: var(--accent); font-size: 14px; font-weight: 600; text-align: left;
}
.tip small { display: block; color: var(--muted); font-weight: 500; font-size: 12px; margin-top: 2px; }

.tip.down { color: var(--text); border-color: var(--line); background: var(--surface-2); }
.feel { display: flex; align-items: center; gap: 10px; margin-top: 12px; }
.feel > span { color: var(--muted); font-size: 13px; white-space: nowrap; }
.feel .seg { flex: 1; margin-top: 0; }
.feel .seg button { padding: 0 6px; font-size: 13px; }
.note-text { margin: 12px 0 0; padding-top: 10px; border-top: 1px solid var(--line); color: var(--muted); font-size: 14px; font-style: italic; overflow-wrap: anywhere; }
.banner.col { display: block; }
.banner .btns { display: flex; gap: 8px; margin-top: 10px; }
.banner .btns button { min-height: 40px; padding: 0 14px; border-radius: 10px; font-size: 14px; font-weight: 700; line-height: 1.2; }
.banner .btns .go { background: var(--accent); color: var(--on-accent); }
.banner .btns .later { background: var(--surface-2); color: var(--text); }
#clock { color: var(--text); font-weight: 600; }
dialog label.field { display: flex; margin-top: 0; }
dialog label.field > * { margin-top: 0; }
dialog .check { font-size: 22px; color: var(--muted); }

/* ---------- итог тренировки ---------- */
.sum-list { margin: 14px 0 0; padding: 0; list-style: none; }
.sum-list li { display: flex; justify-content: space-between; gap: 12px; align-items: baseline; padding: 10px 0; border-top: 1px solid var(--line); font-size: 14px; }
.sum-list .n { font-weight: 600; overflow-wrap: anywhere; }
.sum-list .s { color: var(--muted); font-variant-numeric: tabular-nums; }
.sum-list .r { text-align: right; white-space: nowrap; font-weight: 700; font-variant-numeric: tabular-nums; }
.sum-list .r.up { color: var(--accent); }
.sum-list .r.same, .sum-list .r.new { color: var(--muted); font-weight: 600; }
.sum-list .rec { display: inline-block; margin-top: 2px; padding: 1px 8px; border-radius: 99px; background: var(--accent); color: var(--on-accent); font-size: 12px; font-weight: 800; }
.status { margin: 0; font-size: 14px; }
.status.err { color: var(--danger); }
a { color: var(--accent); }

/* ---------- calendar ---------- */
.cal { display: grid; grid-template-columns: repeat(7, 1fr); gap: 6px; }
.cal .wd { text-align: center; color: var(--muted); font-size: 11px; padding-bottom: 2px; }
.cal .d {
  aspect-ratio: 1; display: grid; place-items: center; border-radius: 10px;
  background: var(--surface-2); color: var(--muted); font-size: 12px; font-variant-numeric: tabular-nums;
}
.cal .d.on { background: var(--accent); color: var(--on-accent); font-weight: 800; }
.cal .d.today { box-shadow: inset 0 0 0 1.5px var(--muted); }
.cal .d.future { opacity: .35; }
.h-actions { display: flex; gap: 14px; flex: none; }
.h-list li { display: flex; justify-content: space-between; gap: 12px; }
.h-list .dur { color: var(--muted); white-space: nowrap; font-variant-numeric: tabular-nums; }

/* ---------- time per exercise ---------- */
.t-row { display: block; width: 100%; text-align: left; padding: 12px 0; border-bottom: 1px solid var(--line); }
.t-row:last-child { border-bottom: 0; }
.t-top { display: flex; justify-content: space-between; gap: 12px; align-items: baseline; }
.t-top .n { font-weight: 600; overflow-wrap: anywhere; }
.t-top .v { font-weight: 800; font-variant-numeric: tabular-nums; white-space: nowrap; }
.t-bar { margin-top: 8px; height: 6px; background: var(--surface-2); border-radius: 4px; overflow: hidden; }
.t-bar > div { height: 100%; background: var(--accent); border-radius: 4px; }
.t-sub { margin-top: 6px; color: var(--muted); font-size: 12px; font-variant-numeric: tabular-nums; }

/* ---------- stats ---------- */
.tiles { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-top: 14px; }
.tile { padding: 10px 12px; background: var(--surface-2); border-radius: 12px; }
.tile .k { color: var(--muted); font-size: 12px; }
.tile .v { font-size: 20px; font-weight: 800; font-variant-numeric: tabular-nums; }
.tile .v small { font-size: 12px; font-weight: 600; color: var(--muted); }
.chart { display: block; width: 100%; height: auto; margin-top: 14px; touch-action: manipulation; }
.chart text { fill: var(--muted); font-size: 10px; font-variant-numeric: tabular-nums; }
.chart .grid { stroke: var(--line); stroke-width: 1; }
.chart .cross { stroke: var(--muted); stroke-width: 1; stroke-dasharray: 3 3; }
.chart .line { fill: none; stroke: var(--accent); stroke-width: 2; stroke-linejoin: round; stroke-linecap: round; }
.chart .pt { fill: var(--accent); stroke: var(--surface); stroke-width: 2; }
.chart .hit { fill: transparent; cursor: pointer; }
.chart-cap { color: var(--muted); font-size: 12px; margin-top: 4px; }
.picked { margin-top: 8px; padding: 10px 12px; background: var(--surface-2); border-radius: 12px; font-size: 14px; font-variant-numeric: tabular-nums; }
.picked b { color: var(--accent); }
.s-list { margin: 14px 0 0; padding: 0; list-style: none; font-size: 14px; font-variant-numeric: tabular-nums; }
.s-list li { display: flex; justify-content: space-between; gap: 12px; padding: 8px 0; border-top: 1px solid var(--line); }
.s-list .dt { color: var(--muted); white-space: nowrap; }
.s-list .rec { color: var(--accent); font-weight: 700; }
.card.list { padding: 6px 16px; }
select, .input {
  width: 100%; min-height: 46px; padding: 0 12px;
  background: var(--surface-2); border: 1px solid var(--line); border-radius: 12px; outline: 0;
  font-size: 16px;
}
textarea.input { padding: 10px 12px; min-height: 70px; resize: vertical; }
select:focus, .input:focus { border-color: var(--accent); }
.setting { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
.setting select { width: auto; }
.hint { color: var(--muted); font-size: 14px; margin: 10px 0 0; }

/* ---------- dialog ---------- */
dialog {
  width: min(520px, calc(100vw - 24px)); max-height: calc(100dvh - 40px);
  padding: 20px; border: 1px solid var(--line); border-radius: 22px;
  background: var(--surface); color: var(--text);
}
dialog::backdrop { background: rgba(0, 0, 0, .65); backdrop-filter: blur(4px); }
dialog h2 { margin: 0 0 14px; font-size: 20px; }
dialog label { display: block; margin-top: 12px; font-size: 13px; color: var(--muted); }
dialog label > * { margin-top: 6px; color: var(--text); }
.grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.dlg-actions { display: flex; gap: 10px; margin-top: 18px; }
.dlg-actions .primary, .dlg-actions .secondary { margin-top: 0; min-height: 48px; }

/* ---------- nav, rest, toast ---------- */
nav {
  position: fixed; left: 0; right: 0; bottom: 0; z-index: 10;
  padding: 8px 16px calc(var(--safe-b) + 8px);
  background: rgba(11, 12, 15, .88); backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px);
  border-top: 1px solid var(--line);
}
nav > div { max-width: 528px; margin: 0 auto; display: flex; gap: 4px; }
nav button {
  flex: 1; min-height: 50px; border-radius: 12px;
  display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px;
  color: var(--muted); font-size: 11px; font-weight: 600;
}
nav button svg { width: 24px; height: 24px; }
nav button[aria-current="page"] { color: var(--accent); }

#rest {
  position: fixed; left: 0; right: 0; z-index: 9;
  bottom: calc(var(--safe-b) + 78px);
  display: flex; justify-content: center; padding: 0 16px; pointer-events: none;
}
#rest > div {
  pointer-events: auto;
  display: flex; align-items: center; gap: 14px;
  padding: 8px 8px 8px 18px;
  background: var(--surface-2); border: 1px solid var(--line); border-radius: 99px;
  box-shadow: 0 10px 30px rgba(0, 0, 0, .5);
}
#rest .lbl { color: var(--muted); font-size: 13px; }
#rest .time { font-size: 22px; font-weight: 800; font-variant-numeric: tabular-nums; color: var(--accent); min-width: 56px; }
#rest button { min-height: 40px; padding: 0 14px; border-radius: 99px; background: var(--surface); font-weight: 600; font-size: 14px; white-space: nowrap; }
#rest.over .time { color: var(--text); }

#toast {
  position: fixed; left: 50%; top: calc(var(--safe-t) + 16px); z-index: 20;
  transform: translate(-50%, -80px); opacity: 0;
  max-width: calc(100vw - 32px); padding: 12px 18px; border-radius: 14px;
  background: var(--text); color: var(--bg); font-weight: 600; font-size: 15px; text-align: center;
  transition: transform .3s ease, opacity .3s;
  pointer-events: none;
}
#toast.show { transform: translate(-50%, 0); opacity: 1; }

@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>
</head>
<body>
<main id="app"></main>

<div id="rest" hidden>
  <div>
    <span class="lbl">Отдых</span>
    <span class="time">1:30</span>
    <button data-act="rest-add">+30 с</button>
    <button data-act="rest-skip">Пропустить</button>
  </div>
</div>

<nav>
  <div>
    <button data-tab="workout">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M6.5 6.5v11M17.5 6.5v11M3.5 9v6M20.5 9v6M6.5 12h11"/></svg>
      Тренировка
    </button>
    <button data-tab="history">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="8.5"/><path d="M12 7.5V12l3 2"/></svg>
      История
    </button>
    <button data-tab="settings">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 7h10M18 7h2M4 17h2M10 17h10"/><circle cx="16" cy="7" r="2"/><circle cx="8" cy="17" r="2"/></svg>
      Программа
    </button>
  </div>
</nav>

<dialog id="editor">
  <form method="dialog">
    <h2 id="ed-title">Упражнение</h2>
    <label>Название<input class="input" name="name" required maxlength="80" autocomplete="off"></label>
    <div class="grid-2">
      <label>Подходы<input class="input" name="sets" type="number" inputmode="numeric" min="1" max="10" required></label>
      <label>Повторы<input class="input" name="reps" placeholder="8-10" maxlength="12" required autocomplete="off"></label>
    </div>
    <label>Снаряд
      <select name="kind">
        <option value="free">Штанга / гантели</option>
        <option value="plate">Блин / гантель</option>
        <option value="machine">Тренажёр</option>
        <option value="body">Свой вес</option>
      </select>
    </label>
    <div class="grid-2">
      <label id="ed-eq-wrap">По умолчанию<select name="equipment"></select></label>
      <label id="ed-w-wrap">Стартовый вес, кг<input class="input" name="weight" inputmode="decimal" autocomplete="off"></label>
    </div>
    <label>Отдых после подхода
      <select name="rest">
        <option value="">Как в настройках</option>
        <option value="45">45 сек</option>
        <option value="60">1 мин</option>
        <option value="90">1,5 мин</option>
        <option value="120">2 мин</option>
        <option value="150">2,5 мин</option>
        <option value="180">3 мин</option>
        <option value="240">4 мин</option>
      </select>
    </label>
    <label>Заметка<textarea class="input" name="note" maxlength="200"></textarea></label>
    <div class="dlg-actions">
      <button type="button" class="secondary" data-act="ed-cancel">Отмена</button>
      <button type="submit" class="primary">Сохранить</button>
    </div>
    <button type="button" class="link danger" id="ed-delete" data-act="ed-delete" style="margin-top:14px">Удалить упражнение</button>
  </form>
</dialog>

<dialog id="sess">
  <h2>Правка тренировки</h2>
  <div id="sess-body"></div>
  <div class="dlg-actions">
    <button type="button" class="secondary" data-act="se-cancel">Отмена</button>
    <button type="button" class="primary" data-act="se-save">Сохранить</button>
  </div>
</dialog>

<dialog id="summary">
  <div id="summary-body"></div>
  <button type="button" class="primary" data-act="summary-close">Готово</button>
</dialog>

<dialog id="stats">
  <div id="stats-body"></div>
  <button class="secondary" data-act="stats-close" style="margin-top:16px">Закрыть</button>
</dialog>

<input type="file" id="import-file" accept="application/json,.json" hidden>
<div id="toast" role="status"></div>

<script>
const KEY = 'workout-tracker.v1';
const EQUIP = { barbell: 'Штанга', dumbbell: 'Гантели', plate: 'Блин' };
const OPTIONS = { free: ['barbell', 'dumbbell'], plate: ['plate', 'dumbbell'] };
const KIND_LABEL = { machine: 'Тренажёр', body: 'Свой вес' };
const FEEL = { easy: 'Легко', ok: 'Нормально', hard: 'Тяжело' };
const STALE_MS = 6 * 3600e3; // тренировка, начатая раньше, считается брошенной
const CHART_SVG = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 18l5-6 4 3 7-9"/></svg>';
const CHECK_SVG = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>';

// Отдых по умолчанию: тяжёлые базовые — дольше, мелкие мышцы и пресс — короче
const REST_DEFAULTS = {
  squat: 150, bench: 120, row: 120, ohp: 120, 'wrist-curl': 60, crunch: 60, 'leg-raise': 60,
  'leg-press': 150, 'lat-pulldown': 120, 'incline-press': 120, 'lateral-raise': 60, 'wrist-ext': 60, twist: 60,
};
function defaultProgram() {
  const ex = (id, name, reps, kind, extra = {}) =>
    ({ id, name, sets: 3, reps, kind, equipment: OPTIONS[kind] ? OPTIONS[kind][0] : null, weight: '', note: '', rest: REST_DEFAULTS[id] || null, ...extra });
  return { days: [
    { id: 'wed', name: 'Среда', weekday: 3, exercises: [
      ex('squat', 'Приседания', '8-10', 'free'),
      ex('bench', 'Жим лёжа', '8-10', 'free', { weight: 25 }),
      ex('row', 'Тяга в наклоне', '8-10', 'free', { weight: 25 }),
      ex('ohp', 'Жим стоя (OHP)', '8-10', 'free'),
      ex('curl', 'Подъём на бицепс', '10-12', 'free'),
      ex('wrist-curl', 'Сгибание запястий (предплечья)', '15-20', 'free', { note: 'Лёгкий вес, ~10–15 кг' }),
      ex('crunch', 'Скручивания (верх пресса)', '15-20', 'body'),
      ex('leg-raise', 'Подъём ног лёжа (низ пресса)', '12-15', 'body'),
    ] },
    { id: 'sun', name: 'Воскресенье', weekday: 0, exercises: [
      ex('leg-press', 'Жим ногами', '10-12', 'machine', { weight: 70, note: '70–80 кг' }),
      ex('lat-pulldown', 'Тяга верхнего блока', '8-10', 'machine'),
      ex('incline-press', 'Жим на наклонной', '8-10', 'free', { equipment: 'dumbbell' }),
      ex('pec-deck', 'Бабочка (pec deck)', '10-12', 'machine', { note: 'Начни со среднего веса тренажёра и подбери по ощущениям — веса на каждом станке свои' }),
      ex('lateral-raise', 'Разведение в стороны', '12-15', 'free', { equipment: 'dumbbell' }),
      ex('triceps', 'Трицепс на блоке', '10-12', 'machine'),
      ex('wrist-ext', 'Разгибание запястий (предплечья)', '15-20', 'free', { note: 'Обратный хват, легче чем сгибание, ~5–8 кг' }),
      ex('twist', 'Русская скрутка (косые)', '20', 'plate', { note: 'По 10 на сторону' }),
    ] },
  ] };
}

function load() {
  try {
    const s = JSON.parse(localStorage.getItem(KEY));
    if (s && s.program && Array.isArray(s.program.days) && Array.isArray(s.sessions)) {
      return { draft: {}, settings: {}, ...s };
    }
  } catch {}
  return { program: defaultProgram(), sessions: [], draft: {}, settings: {} };
}
let state = load();
// Программы, сохранённые до появления отдельного отдыха, получают значения по умолчанию
for (const d of state.program.days) for (const ex of d.exercises) if (ex.rest === undefined) ex.rest = REST_DEFAULTS[ex.id] || null;
function save() {
  try { localStorage.setItem(KEY, JSON.stringify(state)); }
  catch { toast('Не удалось сохранить данные'); }
}

const $ = (sel, root = document) => root.querySelector(sel);
const app = $('#app');
const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
const num = (v) => { const n = parseFloat(String(v).replace(',', '.')); return Number.isFinite(n) ? n : ''; };
const restSeconds = () => state.settings.rest ?? 90;
const pad2 = (n) => String(n).padStart(2, '0');
function fmtDur(sec) {
  sec = Math.max(0, Math.round(sec));
  const h = Math.floor(sec / 3600), m = Math.floor((sec % 3600) / 60);
  return h ? `${h}:${pad2(m)}:${pad2(sec % 60)}` : `${m}:${pad2(sec % 60)}`;
}
const fmtMin = (sec) => (sec >= 3600 ? `${Math.floor(sec / 3600)} ч ${Math.round((sec % 3600) / 60)} мин` : `${Math.max(1, Math.round(sec / 60))} мин`);
const dkey = (d) => `${d.getFullYear()}-${d.getMonth()}-${d.getDate()}`;
const isStandalone = () => matchMedia('(display-mode: standalone)').matches || navigator.standalone === true;

function nearestDayId() {
  const today = new Date().getDay();
  let best = state.program.days[0], bestDist = 8;
  for (const d of state.program.days) {
    const dist = (d.weekday - today + 7) % 7;
    if (dist < bestDist) { best = d; bestDist = dist; }
  }
  return best.id;
}
const ui = { tab: 'workout', dayId: nearestDayId(), histView: 'log', timeDay: null };
const getDay = (id) => state.program.days.find((d) => d.id === id) || state.program.days[0];
const getEx = (day, id) => day.exercises.find((e) => e.id === id);

const eqLabel = (kind, eq) => (kind === 'plate' && eq === 'dumbbell' ? 'Гантель' : EQUIP[eq]);
const unit = (kind, eq) => (kind === 'free' && eq === 'dumbbell' ? 'кг/шт' : 'кг');

/* ---------- history lookups ---------- */
function lastEntry(exId, equipment) {
  for (const s of state.sessions) {
    const e = s.entries.find((x) => x.exId === exId && (equipment === undefined || (x.equipment ?? null) === equipment));
    if (e) return { entry: e, date: s.date };
  }
  return null;
}

// Все сессии упражнения с данным снарядом, от старых к новым
function exHistory(exId, equipment) {
  return state.sessions
    .map((s) => ({ date: s.date, entry: s.entries.find((x) => x.exId === exId && (x.equipment ?? null) === equipment) }))
    .filter((x) => x.entry)
    .reverse();
}

/* ---------- подсказка прогрессии ---------- */
const STEP = { barbell: 2.5, dumbbell: 1, plate: 2.5 };
function repRange(reps) {
  const m = String(reps).match(/\d+/g) || [];
  return { lo: +m[0] || 0, hi: +(m[1] ?? m[0]) || 0 };
}
// Двойная прогрессия: все подходы на верхней границе повторов → пора прибавлять
function suggestion(ex, entry) {
  const hist = exHistory(ex.id, entry.equipment).map((h) => h.entry);
  const last = hist[hist.length - 1];
  const { hi } = repRange(ex.reps);
  if (!last || !hi) return null;
  const u = unit(ex.kind, entry.equipment);
  const topW = (e) => Math.max(...e.sets.map((x) => +x.w || 0));
  const totalReps = (e) => e.sets.reduce((a, x) => a + (+x.r || 0), 0);
  const top = topW(last);

  if (last.sets.length >= ex.sets && last.sets.every((x) => x.r >= hi)) {
    const head = `В прошлый раз все подходы по ${hi}`;
    if (last.feel === 'hard') return { text: 'Закрепи этот вес', sub: `${head}, но было тяжело — повтори ещё раз, прибавишь в следующий` };
    if (ex.kind === 'body') return { text: 'Пора усложнять', sub: `${head} — добавь повторов или возьми отягощение` };
    if (!top) return { text: 'Пора прибавить вес', sub: head };
    if (ex.kind === 'machine') {
      if (entry.sets.every((x) => x.done || +x.w > top)) return null;
      return { text: 'Пора прибавить вес', sub: `${head} × ${top} кг — ставь следующий шаг тренажёра` };
    }
    const w = top + STEP[entry.equipment];
    if (entry.sets.every((x) => x.done || +x.w >= w)) return null;
    return { text: `Пора прибавить: ${w} ${u}`, sub: `${head} × ${top} — нажми, чтобы подставить`, w };
  }

  // Застой: 3 тренировки подряд на одном весе, а повторов больше не стало → сброс примерно на 10%
  if (ex.kind === 'body' || !top || hist.length < 3) return null;
  const three = hist.slice(-3);
  if (!three.every((e) => topW(e) === top) || totalReps(three[2]) > totalReps(three[0])) return null;
  const step = ex.kind === 'machine' ? 5 : STEP[entry.equipment];
  let w = Math.round((top * 0.9) / step) * step;
  if (w >= top) w = top - step;
  if (w <= 0) return null;
  if (entry.sets.every((x) => x.done || (+x.w > 0 && +x.w <= w))) return null;
  return {
    text: `Вес не идёт — сбрось до ${w} ${u}`,
    sub: `3 тренировки на ${top} ${u} без роста повторов. Убери ${fmtNum(top - w)} ${u} и набирай заново — нажми, чтобы подставить`,
    w, down: true,
  };
}

// Цель на подход: тот же вес — на повтор больше, чем в прошлый раз; вес вырос — нижняя граница; вес снижен — верхняя
function targetReps(ex, entry, i) {
  const { lo, hi } = repRange(ex.reps);
  const last = lastEntry(ex.id, entry.equipment)?.entry;
  if (!last) return lo || '';
  const ls = last.sets[i] || last.sets[last.sets.length - 1];
  const prev = +ls.r || 0;
  if (ex.kind !== 'body') {
    const w = +entry.sets[i].w || 0, lw = +ls.w || 0;
    if (w > lw) return lo || prev;
    if (w < lw) return hi || prev;
  }
  if (!hi) return prev;
  if (prev >= hi) return ex.kind === 'body' ? prev + 1 : hi;
  return prev + 1;
}

/* ---------- время тренировки ---------- */
function draftStart(day) {
  const t = state.draft[day.id]?.startedAt;
  return t && Date.now() - t < STALE_MS ? t : null;
}
// Время упражнения = сумма промежутков от предыдущего отмеченного подхода (любого упражнения) до каждого его подхода
function exDurations(day) {
  const d = state.draft[day.id];
  if (!d || !d.startedAt) return {};
  const ev = [];
  for (const ex of day.exercises) {
    for (const x of d.entries[ex.id]?.sets || []) if (x.done && x.t) ev.push({ id: ex.id, t: x.t });
  }
  ev.sort((a, b) => a.t - b.t);
  const out = {};
  let prev = d.startedAt;
  for (const x of ev) {
    out[x.id] = (out[x.id] || 0) + Math.max(0, x.t - prev) / 1000;
    prev = Math.max(prev, x.t);
  }
  return out;
}

/* ---------- резервная копия ---------- */
function backupDue() {
  if (!state.sessions.length) return 0;
  if ((state.settings.backupSnooze || 0) > Date.now()) return 0;
  const base = state.settings.lastBackup || new Date(state.sessions[state.sessions.length - 1].date).getTime();
  const days = Math.floor((Date.now() - base) / 864e5);
  return days >= 30 ? days : 0;
}
function backupBanner() {
  const days = backupDue();
  if (!days) return '';
  return `
    <div class="banner col">
      <p>${state.settings.lastBackup ? `Резервная копия не обновлялась ${days} дн.` : 'Резервная копия ещё ни разу не делалась.'} Вся история хранится только в этом телефоне.</p>
      <div class="btns"><button class="go" data-act="export">Сохранить копию</button><button class="later" data-act="backup-later">Позже</button></div>
    </div>`;
}
const feelSeg = (act, cur, attr = '') => `
  <div class="feel"><span>Как пошло?</span><div class="seg small" role="group" aria-label="Оценка">${Object.entries(FEEL).map(([k, l]) =>
    `<button type="button" data-act="${act}" data-feel="${k}" ${attr} aria-pressed="${cur === k}">${l}</button>`).join('')}</div></div>`;

/* ---------- draft (текущая тренировка) ---------- */
function fillSets(ex, entry) {
  const last = lastEntry(ex.id, entry.equipment)?.entry;
  const count = Math.max(ex.sets, entry.sets.length, 1);
  const fallbackReps = parseInt(ex.reps, 10) || '';
  for (let i = 0; i < count; i++) {
    const cur = entry.sets[i];
    if (cur && cur.done) continue;
    const ls = last && (last.sets[i] || last.sets[last.sets.length - 1]);
    const w = ls ? ls.w : (entry.equipment === ex.equipment ? ex.weight : '');
    entry.sets[i] = { w: w ?? '', r: cur ? cur.r : '', ph: ls ? ls.r : fallbackReps, done: false };
  }
}
function entryFor(day, ex) {
  const d = (state.draft[day.id] ||= { entries: {} });
  const opts = OPTIONS[ex.kind];
  let e = d.entries[ex.id];
  if (e && (opts ? !opts.includes(e.equipment) : e.equipment !== null)) e = null;
  if (!e) {
    const prev = lastEntry(ex.id)?.entry.equipment;
    e = d.entries[ex.id] = { equipment: opts ? (opts.includes(prev) ? prev : ex.equipment) : null, sets: [] };
    fillSets(ex, e);
  }
  return e;
}
function dayProgress(day) {
  let done = 0, total = 0;
  for (const ex of day.exercises) {
    for (const s of entryFor(day, ex).sets) { total++; if (s.done) done++; }
  }
  return { done, total };
}

/* ---------- views ---------- */
const fmtSets = (kind, sets) => sets.map((s) => (kind === 'body' || s.w === '' || s.w == null ? `${s.r}` : `${s.w}×${s.r}`)).join(' · ');
const shortDate = (iso) => new Date(iso).toLocaleDateString('ru-RU', { day: 'numeric', month: 'short' });

function viewWorkout() {
  const day = getDay(ui.dayId);
  const { done, total } = dayProgress(day);
  const started = draftStart(day);
  const durs = exDurations(day);
  const today = new Date().toLocaleDateString('ru-RU', { weekday: 'long', day: 'numeric', month: 'long' });
  const banner = !isStandalone() && !state.settings.hintDismissed ? `
    <div class="banner">
      <p>Добавьте сайт на экран «Домой» (меню «Поделиться» в браузере) — так он откроется как приложение, а записи надёжно сохранятся.</p>
      <button data-act="hint-dismiss" aria-label="Скрыть">×</button>
    </div>` : '';

  const cards = day.exercises.map((ex, idx) => {
    const e = entryFor(day, ex);
    const opts = OPTIONS[ex.kind];
    const complete = e.sets.length > 0 && e.sets.every((s) => s.done);
    const last = lastEntry(ex.id, e.equipment);
    const body = ex.kind === 'body';
    const tip = suggestion(ex, e);
    return `
    <section class="card${complete ? ' complete' : ''}" data-ex="${esc(ex.id)}">
      <div class="card-head">
        <div class="num">${idx + 1}</div>
        <div class="card-title">
          <h2>${esc(ex.name)}</h2>
          <div class="chips">
            <span class="chip">${ex.sets}×${esc(ex.reps)}</span>
            ${opts ? '' : `<span class="chip ghost">${KIND_LABEL[ex.kind]}</span>`}
            ${complete && durs[ex.id] ? `<span class="chip ghost">${fmtDur(durs[ex.id])}</span>` : ''}
          </div>
        </div>
        <button class="icon-btn" data-act="stats" aria-label="Прогресс: ${esc(ex.name)}">${CHART_SVG}</button>
      </div>
      ${ex.note ? `<p class="note">${esc(ex.note)}</p>` : ''}
      ${opts ? `<div class="seg small" role="group" aria-label="Снаряд">${opts.map((o) =>
        `<button data-act="equip" data-eq="${o}" aria-pressed="${e.equipment === o}">${eqLabel(ex.kind, o)}</button>`).join('')}</div>` : ''}
      ${last ? `<p class="last">В прошлый раз, ${shortDate(last.date)}: <b>${esc(fmtSets(ex.kind, last.entry.sets))}</b>${last.entry.feel ? ` · ${FEEL[last.entry.feel].toLowerCase()}` : ''}</p>` : ''}
      ${tip ? `<${tip.w ? `button data-act="bump" data-w="${tip.w}"` : 'p'} class="tip${tip.down ? ' down' : ''}">${tip.down ? '↓' : '↑'} ${esc(tip.text)}<small>${esc(tip.sub)}</small></${tip.w ? 'button' : 'p'}>` : ''}
      <div class="sets">
        ${e.sets.map((s, i) => `
        <div class="set${s.done ? ' done' : ''}${body ? ' body' : ''}" data-i="${i}">
          <span class="set-n">${i + 1}</span>
          ${body ? '' : `<label class="field"><input data-f="w" inputmode="decimal" autocomplete="off" value="${esc(s.w)}" placeholder="0" aria-label="Вес"><span>${unit(ex.kind, e.equipment)}</span></label><span class="x">×</span>`}
          <label class="field"><input data-f="r" inputmode="numeric" autocomplete="off" value="${esc(s.r)}" placeholder="${esc(targetReps(ex, e, i))}" aria-label="Повторы, цель"><span>повт</span></label>
          <button class="check" data-act="check" aria-pressed="${s.done}" aria-label="Подход ${i + 1} выполнен">${CHECK_SVG}</button>
        </div>`).join('')}
      </div>
      <div class="set-tools">
        <button class="link" data-act="set-add">+ подход</button>
        ${e.sets.length > 1 ? '<button class="link" data-act="set-remove">− убрать</button>' : ''}
      </div>
      ${complete ? feelSeg('feel', e.feel) : ''}

  }).join('');

  return `
    ${banner}${backupBanner()}
    <div class="date">${today}</div>
    <h1>Тренировка</h1>
    <div class="sticky">
      <div class="seg" role="group" aria-label="День">
        ${state.program.days.map((d) => `<button data-act="day" data-day="${esc(d.id)}" aria-pressed="${d.id === day.id}">${esc(d.name)}</button>`).join('')}
      </div>
      <div class="progress"><div style="width:${total ? (done / total) * 100 : 0}%"></div></div>
      <div class="progress-label">${done} из ${total} подходов${started ? ` · идёт <span id="clock">${fmtDur((Date.now() - started) / 1000)}</span>` : ''}</div>
    </div>
    ${!started && !done ? '<button class="primary" data-act="start" style="margin-top:8px">Начать тренировку</button><p class="hint">Запустит секундомер: посчитается время всей тренировки и каждого упражнения.</p>' : ''}
    ${cards || '<p class="empty">В этом дне пока нет упражнений</p>'}
    ${started || done ? `<textarea class="input" id="note" maxlength="300" placeholder="Заметка к тренировке (необязательно)" style="margin-top:16px">${esc(state.draft[day.id]?.note || '')}</textarea>` : ''}
    <button class="primary" data-act="finish">Завершить тренировку</button>
    ${done || started ? '<button class="secondary" data-act="reset-draft">Сбросить тренировку</button>' : ''}`;
}

function weekStart(d) {
  const x = new Date(d.getFullYear(), d.getMonth(), d.getDate());
  x.setDate(x.getDate() - ((x.getDay() + 6) % 7));
  return x;
}
function attendance() {
  const days = new Set(state.sessions.map((s) => dkey(new Date(s.date))));
  const planned = state.program.days.length;
  const cur = weekStart(new Date());
  const inWeek = (k) => {
    let n = 0;
    for (let i = 0; i < 7; i++) {
      const d = new Date(cur);
      d.setDate(cur.getDate() - 7 * k + i);
      if (days.has(dkey(d))) n++;
    }
    return n;
  };
  // Текущая неделя, пока не закрыта, серию не прерывает
  let streak = 0;
  for (let k = 0; k < 520; k++) {
    if (inWeek(k) >= planned) streak++;
    else if (k > 0) break;
  }
  let last4 = 0;
  for (let k = 0; k < 4; k++) last4 += Math.min(inWeek(k), planned);
  return { days, streak, last4, planned, cur };
}
function calendarHtml(att, weeks = 6) {
  const todayKey = dkey(new Date()), now = Date.now();
  let cells = ['Пн', 'Вт', 'Ср', 'Чт', 'Пт', 'Сб', 'Вс'].map((w) => `<div class="wd">${w}</div>`).join('');
  for (let k = weeks - 1; k >= 0; k--) {
    for (let i = 0; i < 7; i++) {
      const d = new Date(att.cur);
      d.setDate(att.cur.getDate() - 7 * k + i);
      const key = dkey(d);
      const on = att.days.has(key);
      cells += `<div class="d${on ? ' on' : ''}${key === todayKey ? ' today' : ''}${d.getTime() > now ? ' future' : ''}"${on ? ' aria-label="Тренировка"' : ''}>${d.getDate()}</div>`;
    }
  }
  return `<div class="cal">${cells}</div>`;
}

function viewLog() {
  return state.sessions.map((s) => {
    const setCount = s.entries.reduce((a, e) => a + e.sets.length, 0);
    const date = new Date(s.date).toLocaleDateString('ru-RU', { weekday: 'short', day: 'numeric', month: 'long', year: 'numeric' });
    return `
    <section class="card" data-session="${esc(s.id)}">
      <div class="h-head">
        <div><h2>${esc(s.dayName)}</h2><div class="h-meta">${date}<br>${s.entries.length} упр. · ${setCount} подх.${s.duration ? ` · ${fmtMin(s.duration)}` : ''}</div></div>
        <div class="h-actions">
          <button class="link" data-act="session-edit">Изменить</button>
          <button class="link danger" data-act="session-delete">Удалить</button>
        </div>
      </div>
      <ul class="h-list">

// Сколько времени уходит на каждое упражнение (среднее по последним 5 тренировкам)
function viewTime() {
  const day = getDay(ui.timeDay || ui.dayId);
  const sess = state.sessions.filter((s) => s.dayId === day.id);
  const totals = sess.filter((s) => s.duration > 0).slice(0, 5).map((s) => s.duration);
  const rows = day.exercises.map((ex) => {
    const ds = [];
    for (const s of sess) {
      const e = s.entries.find((x) => x.exId === ex.id);
      if (e && e.duration > 0) ds.push(e.duration);
      if (ds.length === 5) break;
    }
    return { ex, n: ds.length, last: ds[0] || 0, avg: ds.length ? ds.reduce((a, b) => a + b, 0) / ds.length : 0 };
  });
  const max = Math.max(...rows.map((r) => r.avg), 1);
  const sum = rows.reduce((a, r) => a + r.avg, 0);
  const seg = `<div class="seg small" role="group" aria-label="День" style="margin-top:12px">${state.program.days.map((d) =>
    `<button data-act="time-day" data-day="${esc(d.id)}" aria-pressed="${d.id === day.id}">${esc(d.name)}</button>`).join('')}</div>`;
  if (!sum) {
    return `${seg}<p class="hint">Данных пока нет. Нажмите «Начать тренировку» перед первым подходом — после завершения здесь появится время по каждому упражнению.</p>`;
  }
  return `${seg}
    <section class="card">
      <div class="h-meta" style="margin:0 0 4px">${totals.length ? `Вся тренировка в среднем: <b style="color:var(--text)">${fmtMin(totals.reduce((a, b) => a + b, 0) / totals.length)}</b> · ` : ''}по последним 5 тренировкам, вместе с отдыхом</div>
      ${rows.map((r) => `
      <button class="t-row" data-act="time-open" data-ex="${esc(r.ex.id)}">
        <div class="t-top"><span class="n">${esc(r.ex.name)}</span><span class="v">${r.n ? fmtDur(r.avg) : '—'}</span></div>
        ${r.n ? `<div class="t-bar"><div style="width:${(r.avg / max) * 100}%"></div></div>
        <div class="t-sub">${Math.round((r.avg / sum) * 100)}% тренировки · в последний раз ${fmtDur(r.last)}</div>` : '<div class="t-sub">нет данных</div>'}
      </button>`).join('')}
    </section>
    <p class="hint">Нажмите на упражнение, чтобы увидеть, как менялось время от тренировки к тренировке.</p>`;
}

const views = { workout: viewWorkout, history: viewHistory, settings: viewSettings };
function render() {
  app.innerHTML = views[ui.tab]();
  document.querySelectorAll('nav button').forEach((b) =>
    b.dataset.tab === ui.tab ? b.setAttribute('aria-current', 'page') : b.removeAttribute('aria-current'));
  syncWakeLock();
}

/* ---------- экран не гаснет, пока идёт тренировка ---------- */
let wakeLock = null, wakePending = false;
async function syncWakeLock() {
  if (!('wakeLock' in navigator)) return;
  const want = ui.tab === 'workout' && !document.hidden && !!(draftStart(getDay(ui.dayId)) || dayProgress(getDay(ui.dayId)).done > 0);
  if (want && !wakeLock && !wakePending) {
    wakePending = true;
    try {
      wakeLock = await navigator.wakeLock.request('screen');
      wakeLock.addEventListener('release', () => { wakeLock = null; });
    } catch {}
    wakePending = false;
  } else if (!want && wakeLock) {
    wakeLock.release().catch(() => {});
    wakeLock = null;
  }
}

/* ---------- звук ---------- */
let audioCtx = null;
// Вызывается из обработчика нажатия: iOS разрешает звук только после жеста
function primeAudio() {
  if (state.settings.sound === false) return;
  try {
    audioCtx ||= new (window.AudioContext || window.webkitAudioContext)();
    if (audioCtx.state === 'suspended') audioCtx.resume();
  } catch {}
}
function beep() {
  if (state.settings.sound === false || !audioCtx) return;
  const t = audioCtx.currentTime;
  [[0, 880], [0.22, 880], [0.44, 1175]].forEach(([d, f]) => {
    const o = audioCtx.createOscillator(), g = audioCtx.createGain();
    o.frequency.value = f;
    g.gain.setValueAtTime(0.0001, t + d);
    g.gain.exponentialRampToValueAtTime(0.3, t + d + 0.02);
    g.gain.exponentialRampToValueAtTime(0.0001, t + d + 0.18);
    o.connect(g).connect(audioCtx.destination);
    o.start(t + d);
    o.stop(t + d + 0.2);
  });
}

/* ---------- toast ---------- */
let toastTimer;
function toast(msg) {
  const t = $('#toast');
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => t.classList.remove('show'), 2400);
}

/* ---------- rest timer ---------- */
const restEl = $('#rest');
let restEnd = 0, restTick = null;
function drawRest() {
  const left = Math.ceil((restEnd - Date.now()) / 1000);
  if (left <= 0) {
    clearInterval(restTick); restTick = null;
    restEl.classList.add('over');
    $('.time', restEl).textContent = 'Пора!';
    navigator.vibrate?.([200, 100, 200]);
    beep();
    setTimeout(() => { if (!restTick) restEl.hidden = true; }, 4000);
    return;
  }
  $('.time', restEl).textContent = `${Math.floor(left / 60)}:${String(left % 60).padStart(2, '0')}`;
}
function startRest(seconds) {
  if (!seconds) return;
  primeAudio();
  restEnd = Date.now() + seconds * 1000;
  restEl.hidden = false;
  restEl.classList.remove('over');
  clearInterval(restTick);
  restTick = setInterval(drawRest, 250);
  drawRest();
}
function stopRest() { clearInterval(restTick); restTick = null; restEl.hidden = true; }
document.addEventListener('visibilitychange', () => {
  if (!document.hidden && restTick) drawRest();
  syncWakeLock();
});

/* ---------- actions ---------- */
// Сравнение упражнения с прошлым разом (вызывается до сохранения новой тренировки)
function compareEntry(e) {
  const hist = exHistory(e.exId, e.equipment ?? null).map((h) => h.entry);
  const prev = hist[hist.length - 1];
  if (!prev) return { dir: 'new', text: 'первая запись' };
  const byWeight = e.kind !== 'body' && e.sets.some((x) => +x.w > 0);
  const top = (x) => Math.max(...x.sets.map((q) => +q.w || 0));
  const reps = (x) => x.sets.reduce((a, q) => a + (+q.r || 0), 0);
  const bestSet = (x) => Math.max(...x.sets.map((q) => +q.r || 0));
  const metric = byWeight ? top : bestSet;
  const record = metric(e) > Math.max(...hist.map(metric));
  if (byWeight && top(e) !== top(prev)) {
    const d = top(e) - top(prev);
    return { dir: d > 0 ? 'up' : 'down', text: `${d > 0 ? '↑ +' : '↓ −'}${fmtNum(Math.abs(d))} кг`, record };
  }
  // сделано меньше подходов, чем в прошлый раз — сравниваем только общие
  const k = Math.min(e.sets.length, prev.sets.length);
  const d = reps({ sets: e.sets.slice(0, k) }) - reps({ sets: prev.sets.slice(0, k) });
  if (!d) return { dir: 'same', text: '= как в прошлый раз', record };
  return { dir: d > 0 ? 'up' : 'down', text: `${d > 0 ? '↑ +' : '↓ −'}${Math.abs(d)} повт.`, record };
}
function showSummary(session, cmp) {
  const setCount = session.entries.reduce((a, e) => a + e.sets.length, 0);
  const up = cmp.filter((c) => c.dir === 'up').length;
  const records = cmp.filter((c) => c.record).length;
  $('#summary-body').innerHTML = `
    <h2>Тренировка завершена 💪</h2>
    <div class="tiles" style="margin-top:0">
      <div class="tile"><div class="k">Время</div><div class="v">${session.duration ? fmtDur(session.duration) : '—'}</div></div>
      <div class="tile"><div class="k">Подходов</div><div class="v">${setCount}</div></div>
      <div class="tile"><div class="k">Лучше</div><div class="v">${up} <small>из ${cmp.length}</small></div></div>
    </div>
    ${records ? `<p class="hint">Новых рекордов: ${records}</p>` : ''}
    <ul class="sum-list">
      ${session.entries.map((e, i) => `<li>
        <div><div class="n">${esc(e.name)}</div><div class="s">${esc(fmtSets(e.kind, e.sets))}</div></div>
        <div class="r ${cmp[i].dir}">${cmp[i].text}${cmp[i].record ? '<br><span class="rec">рекорд</span>' : ''}</div>
      </li>`).join('')}
    </ul>
    <p class="hint">Сравнение с прошлой тренировкой на том же снаряде.</p>`;
  $('#summary').showModal();
}

function finishWorkout() {
  const day = getDay(ui.dayId);
  const d = state.draft[day.id];
  const durs = exDurations(day);
  const entries = [];
  let lastT = 0;
  for (const ex of day.exercises) {
    const e = entryFor(day, ex);
    const doneSets = e.sets.filter((s) => s.done);
    if (!doneSets.length) continue;
    for (const s of doneSets) lastT = Math.max(lastT, s.t || 0);
    entries.push({
      exId: ex.id, name: ex.name, kind: ex.kind, equipment: e.equipment,
      sets: doneSets.map((s) => ({ w: num(s.w), r: num(s.r) })),
      feel: e.feel || null,
      duration: Math.round(durs[ex.id] || 0) || null,
    });
  }
  if (!entries.length) { toast('Отметьте хотя бы один подход'); return; }
  const { done, total } = dayProgress(day);
  if (done < total && !confirm(`Выполнено ${done} из ${total} подходов. Завершить тренировку?`)) return;
  const cmp = entries.map(compareEntry);
  const session = {
    id: uid(), date: new Date().toISOString(), dayId: day.id, dayName: day.name, entries,
    duration: d.startedAt && lastT > d.startedAt ? Math.round((lastT - d.startedAt) / 1000) : null,
    note: (d.note || '').trim(),
  };
  state.sessions.unshift(session);
  delete state.draft[day.id];
  save();
  stopRest();
  ui.tab = 'history';
  ui.histView = 'log';
  render();
  scrollTo(0, 0);
  showSummary(session, cmp);
  queueGist();
}

// Черновики без отметок пересобираются, чтобы подхватить исправленную историю
function pruneDrafts() {
  for (const [id, d] of Object.entries(state.draft)) {
    const touched = d.startedAt || Object.values(d.entries).some((e) => e.sets.some((s) => s.done));
    if (!touched) delete state.draft[id];
  }
}

const actions = {
  day(el) { ui.dayId = el.dataset.day; render(); scrollTo(0, 0); },
  'hint-dismiss'() { state.settings.hintDismissed = true; save(); render(); },

    ctx.entry.equipment = el.dataset.eq;
    fillSets(ctx.ex, ctx.entry);
    save(); render();
  },
  check(el, ctx) {
    const i = +el.closest('.set').dataset.i;
    const s = ctx.entry.sets[i];
    if (!s.done) {
      if (s.r === '') s.r = targetReps(ctx.ex, ctx.entry, i);
      if (s.r === '') { toast('Введите число повторов'); return; }
      s.done = true;
      s.t = Date.now();
      const d = state.draft[ctx.day.id];
      if (!draftStart(ctx.day)) d.startedAt = s.t;
      navigator.vibrate?.(15);
      const { done, total } = dayProgress(ctx.day);
      if (done < total) startRest(restSeconds() ? ctx.ex.rest || restSeconds() : 0);
    } else {
      s.done = false;
    }
    save(); render();

  'gist-off'() {
    if (!confirm('Отключить автокопию? Токен будет удалён с этого устройства, сам Gist останется в GitHub.')) return;
    gist = null; saveGist(); render();
  },

    const entries = sessEdit.entries
      .map((e) => ({ ...e, sets: e.sets.map((x) => ({ w: num(x.w), r: num(x.r) })).filter((x) => x.r !== '') }))
      .filter((e) => e.sets.length);

    delete state.draft[ui.dayId];

  },
  'rest-add'() { if (restTick) { restEnd += 30000; drawRest(); } else startRest(30); },
  'rest-skip': stopRest,
  'session-delete'(el) {
    if (!confirm('Удалить эту тренировку из истории?')) return;
    const id = el.closest('[data-session]').dataset.session;

  },
  'ex-edit'(el) { openEditor(el.closest('[data-day]').dataset.day, el.closest('[data-ex]').dataset.ex); },
  'ex-add'(el) { openEditor(el.closest('[data-day]').dataset.day, null); },
  'ex-up'(el) { moveEx(el, -1); },
  'ex-down'(el) { moveEx(el, 1); },
  'ed-cancel'() { editor.close(); },
  'ed-delete'() {
    if (!confirm('Удалить упражнение из программы? История останется.')) return;
    const day = getDay(editing.dayId);
    day.exercises = day.exercises.filter((e) => e.id !== editing.exId);
    delete state.draft[day.id]?.entries[editing.exId];
    save(); editor.close(); render();
  },
  'program-reset'() {
    if (!confirm('Вернуть исходную программу? История тренировок сохранится.')) return;
    state.program = defaultProgram();
    state.draft = {};
    ui.dayId = nearestDayId();
    save(); render();
    toast('Программа сброшена');
  },
  export: exportData,
  import() { $('#import-file').click(); },
};

function moveEx(el, dir) {
  const day = getDay(el.closest('[data-day]').dataset.day);
  const i = day.exercises.findIndex((e) => e.id === el.closest('[data-ex]').dataset.ex);
  const j = i + dir;
  if (j < 0 || j >= day.exercises.length) return;
  [day.exercises[i], day.exercises[j]] = [day.exercises[j], day.exercises[i]];
  save(); render();
}

document.addEventListener('click', (ev) => {
  const tab = ev.target.closest('[data-tab]');
  if (tab) { ui.tab = tab.dataset.tab; render(); scrollTo(0, 0); return; }
  const el = ev.target.closest('[data-act]');
  if (!el) return;
  const ctx = {};
  const card = el.closest('.card[data-ex]');
  if (card && ui.tab === 'workout') {
    ctx.day = getDay(ui.dayId);
    ctx.ex = getEx(ctx.day, card.dataset.ex);
    ctx.entry = entryFor(ctx.day, ctx.ex);
  }
  actions[el.dataset.act]?.(el, ctx);
});

// Ввод веса/повторов: обновляем состояние без перерисовки, чтобы не терять фокус
app.addEventListener('input', (ev) => {
  if (ev.target.id === 'note') {
    const day = getDay(ui.dayId);
    dayProgress(day);
    state.draft[day.id].note = ev.target.value;
    save();
    return;
  }
  const input = ev.target.closest('input[data-f]');
  if (!input) return;
  const day = getDay(ui.dayId);
  const ex = getEx(day, input.closest('.card').dataset.ex);
  const entry = entryFor(day, ex);
  const row = input.closest('.set');
  entry.sets[+row.dataset.i][input.dataset.f] = input.value.trim().replace(',', '.');
  // вес изменился — пересчитать цель по повторам
  if (input.dataset.f === 'w') row.querySelector('input[data-f="r"]').placeholder = targetReps(ex, entry, +row.dataset.i);
  save();
});
app.addEventListener('focusin', (ev) => { if (ev.target.matches('input[data-f]')) ev.target.select(); });
app.addEventListener('change', (ev) => {
  if (ev.target.id === 'rest-select') { state.settings.rest = +ev.target.value; save(); }
  if (ev.target.id === 'sound-select') { state.settings.sound = ev.target.value === '1'; save(); }
});

/* ---------- exercise editor ---------- */
const editor = $('#editor');
const edForm = $('form', editor);
let editing = null;
function syncEditorKind() {
  const kind = edForm.kind.value;
  const opts = OPTIONS[kind];
  const cur = edForm.equipment.value;
  edForm.equipment.innerHTML = (opts || []).map((o) => `<option value="${o}">${eqLabel(kind, o)}</option>`).join('');
  if (opts && opts.includes(cur)) edForm.equipment.value = cur;
  $('#ed-eq-wrap').hidden = !opts;
  $('#ed-w-wrap').hidden = kind === 'body';
}
edForm.kind.addEventListener('change', syncEditorKind);
function openEditor(dayId, exId) {
  editing = { dayId, exId };
  const ex = exId ? getEx(getDay(dayId), exId) : { name: '', sets: 3, reps: '8-10', kind: 'free', equipment: 'barbell', weight: '', note: '' };
  $('#ed-title').textContent = exId ? 'Упражнение' : 'Новое упражнение';
  $('#ed-delete').hidden = !exId;
  edForm.name.value = ex.name;
  edForm.sets.value = ex.sets;
  edForm.reps.value = ex.reps;
  edForm.kind.value = ex.kind;
  syncEditorKind();
  if (ex.equipment) edForm.equipment.value = ex.equipment;
  edForm.weight.value = ex.weight ?? '';
  edForm.note.value = ex.note || '';
  edForm.rest.value = ex.rest || '';
  editor.showModal();
}
edForm.addEventListener('submit', () => {
  const day = getDay(editing.dayId);
  const kind = edForm.kind.value;
  const data = {
    name: edForm.name.value.trim(),
    sets: Math.min(10, Math.max(1, parseInt(edForm.sets.value, 10) || 3)),
    reps: edForm.reps.value.trim(),
    kind,
    equipment: OPTIONS[kind] ? edForm.equipment.value : null,
    weight: kind === 'body' ? '' : num(edForm.weight.value),
    note: edForm.note.value.trim(),
    rest: +edForm.rest.value || null,
  };
  if (editing.exId) {
    Object.assign(getEx(day, editing.exId), data);
    // пересобрать черновик упражнения под новые параметры
    delete state.draft[day.id]?.entries[editing.exId];
  } else {
    day.exercises.push({ id: uid(), ...data });
  }
  save(); render(); queueGist();
});

/* ---------- прогресс по упражнению ---------- */
const statsDlg = $('#stats');
let statsUi = null;
function openStats(dayId, exId, equipment, metric) {
  statsUi = { dayId, exId, equipment, metric, sel: null };
  renderStats();
  statsDlg.showModal();
}
const fmtNum = (v) => String(Math.round(v * 10) / 10);
function chartSvg(pts, sel) {
  const W = 320, H = 170, L = 34, R = 12, T = 14, B = 24;
  const vals = pts.map((p) => p.v);
  const min = Math.min(...vals), max = Math.max(...vals);
  let lo = min, hi = max;
  if (lo === hi) { lo -= 1; hi += 1; }
  const pad = (hi - lo) * 0.18;
  lo -= pad; hi += pad;
  const x = (i) => (pts.length === 1 ? (L + W - R) / 2 : L + ((W - L - R) * i) / (pts.length - 1));
  const y = (v) => T + (H - T - B) * (1 - (v - lo) / (hi - lo));
  const ticks = min === max ? [min] : [min, (min + max) / 2, max];
  return `
  <svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="График прогресса">
    ${ticks.map((t) => `<line class="grid" x1="${L}" x2="${W - R}" y1="${y(t)}" y2="${y(t)}"/><text x="${L - 6}" y="${y(t) + 3}" text-anchor="end">${fmtNum(t)}</text>`).join('')}
    <text x="${L}" y="${H - 6}">${shortDate(pts[0].date)}</text>
    ${pts.length > 1 ? `<text x="${W - R}" y="${H - 6}" text-anchor="end">${shortDate(pts[pts.length - 1].date)}</text>` : ''}
    <line class="cross" x1="${x(sel)}" x2="${x(sel)}" y1="${T}" y2="${H - B}"/>
    ${pts.length > 1 ? `<polyline class="line" points="${pts.map((p, i) => `${x(i)},${y(p.v)}`).join(' ')}"/>` : ''}
    ${pts.map((p, i) => `<circle class="pt" cx="${x(i)}" cy="${y(p.v)}" r="${i === sel ? 6 : 4}"/>`).join('')}
    ${pts.map((p, i) => `<circle class="hit" data-act="stats-pt" data-i="${i}" cx="${x(i)}" cy="${y(p.v)}" r="${Math.max(8, Math.min(18, (W - L - R) / pts.length / 2))}"/>`).join('')}
  </svg>`;
}
function renderStats() {
  const day = getDay(statsUi.dayId);
  const ex = getEx(day, statsUi.exId);
  const opts = OPTIONS[ex.kind];
  const time = statsUi.metric === 'time';
  let pts, u, cap;
  if (time) {
    pts = state.sessions
      .map((s) => ({ date: s.date, e: s.entries.find((x) => x.exId === ex.id) }))
      .filter((x) => x.e && x.e.duration > 0)
      .reverse().slice(-30)
      .map((x) => ({ date: x.date, v: x.e.duration / 60, label: fmtDur(x.e.duration) }));
    u = 'мин';
    cap = 'Время на упражнение вместе с отдыхом, минуты';
  } else {
    const hist = exHistory(ex.id, statsUi.equipment).slice(-30);
    // Есть вес — рисуем лучший вес за тренировку, иначе лучший подход по повторам
    const byWeight = ex.kind !== 'body' && hist.some((h) => h.entry.sets.some((s) => +s.w > 0));
    u = byWeight ? unit(ex.kind, statsUi.equipment) : 'повт';
    cap = byWeight ? `Лучший вес за тренировку, ${u}` : 'Лучший подход за тренировку, повторы';
    pts = hist.map((h) => ({
      date: h.date, label: fmtSets(ex.kind, h.entry.sets),
      v: Math.max(...h.entry.sets.map((s) => (byWeight ? +s.w || 0 : +s.r || 0))),
    }));
  }
  const metricSeg = `<div class="seg small" role="group" aria-label="Показатель">
    <button data-act="stats-metric" data-metric="main" aria-pressed="${!time}">Результат</button>
    <button data-act="stats-metric" data-metric="time" aria-pressed="${time}">Время</button></div>`;
  const eqSeg = opts && !time ? `<div class="seg small" role="group" aria-label="Снаряд" style="margin-top:8px">${opts.map((o) =>
    `<button data-act="stats-eq" data-eq="${o}" aria-pressed="${statsUi.equipment === o}">${eqLabel(ex.kind, o)}</button>`).join('')}</div>` : '';
  let body;
  if (!pts.length) {
    body = `<p class="hint" style="margin-top:16px">${time
      ? 'Времени пока нет. Оно считается, если перед первым подходом нажать «Начать тренировку».'
      : `Пока нет данных${opts ? ' для этого снаряда' : ''}. График появится после первой завершённой тренировки.`}</p>`;
  } else {
    const best = Math.max(...pts.map((p) => p.v));
    const sel = statsUi.sel ?? pts.length - 1;
    const p = pts[sel];
    const lastV = pts[pts.length - 1].v;
    const delta = lastV - pts[0].v;
    const avg = pts.reduce((a, q) => a + q.v, 0) / pts.length;
    const tiles = time
      ? `<div class="tile"><div class="k">В среднем</div><div class="v">${fmtDur(avg * 60)}</div></div>
         <div class="tile"><div class="k">Последний</div><div class="v">${fmtDur(lastV * 60)}</div></div>`
      : `<div class="tile"><div class="k">Рекорд</div><div class="v">${fmtNum(best)} <small>${u}</small></div></div>
         <div class="tile"><div class="k">С начала</div><div class="v">${delta > 0 ? '+' : ''}${fmtNum(delta)} <small>${u}</small></div></div>`;
    body = `
    <div class="tiles">${tiles}
      <div class="tile"><div class="k">Тренировок</div><div class="v">${pts.length}</div></div>
    </div>
    ${chartSvg(pts, sel)}
    <div class="chart-cap">${cap} · нажмите на точку</div>
    <div class="picked">${new Date(p.date).toLocaleDateString('ru-RU', { day: 'numeric', month: 'long', year: 'numeric' })}: <b>${esc(p.label)}</b></div>
    <ul class="s-list">
      ${pts.slice(-8).reverse().map((q) => `<li><span class="dt">${shortDate(q.date)}</span><span${!time && q.v === best ? ' class="rec"' : ''}>${esc(q.label)}</span></li>`).join('')}
    </ul>`;
  }
  $('#stats-body').innerHTML = `<h2>${esc(ex.name)}</h2>${metricSeg}${eqSeg}${body}`;
}

/* ---------- правка прошлой тренировки ---------- */
const sessDlg = $('#sess');
let sessEdit = null;
function renderSessEdit() {
  $('#sess-body').innerHTML = sessEdit.entries.map((e, ei) => `
    <h3 style="margin-top:18px">${esc(e.name)}${e.equipment ? ` · ${eqLabel(e.kind, e.equipment)}` : ''}</h3>
    <div class="sets">
      ${e.sets.map((x, si) => `
      <div class="set${e.kind === 'body' ? ' body' : ''}" data-ei="${ei}" data-si="${si}">
        <span class="set-n">${si + 1}</span>
        ${e.kind === 'body' ? '' : `<label class="field"><input data-f="w" inputmode="decimal" autocomplete="off" value="${esc(x.w)}" placeholder="0" aria-label="Вес"><span>кг</span></label><span class="x">×</span>`}
        <label class="field"><input data-f="r" inputmode="numeric" autocomplete="off" value="${esc(x.r)}" aria-label="Повторы"><span>повт</span></label>
        <button type="button" class="check" data-act="se-rm" aria-label="Удалить подход">×</button>
      </div>`).join('')}
    </div>
    <div class="set-tools"><button type="button" class="link" data-act="se-add" data-ei="${ei}">+ подход</button></div>
    ${feelSeg('se-feel', e.feel, `data-ei="${ei}"`)}`).join('') + `
    <label>Заметка<textarea class="input" id="se-note" maxlength="300">${esc(sessEdit.note || '')}</textarea></label>`;
}
sessDlg.addEventListener('input', (ev) => {
  if (ev.target.id === 'se-note') { sessEdit.note = ev.target.value; return; }
  const row = ev.target.closest('.set');
  if (!row || !ev.target.dataset.f) return;
  sessEdit.entries[+row.dataset.ei].sets[+row.dataset.si][ev.target.dataset.f] = ev.target.value.trim().replace(',', '.');
});

/* ---------- автокопия в GitHub Gist ---------- */
// Токен лежит отдельно от данных, чтобы не попасть ни в файл копии, ни в сам Gist
const GIST_KEY = 'workout-tracker.gist', GIST_FILE = 'workout-tracker-backup.json';
let gist = (() => { try { return JSON.parse(localStorage.getItem(GIST_KEY)) || null; } catch { return null; } })();
let gistBusy = false;
function saveGist() {
  try { gist ? localStorage.setItem(GIST_KEY, JSON.stringify(gist)) : localStorage.removeItem(GIST_KEY); } catch {}
}
const backupJson = () => JSON.stringify({ program: state.program, sessions: state.sessions, settings: state.settings, savedAt: new Date().toISOString() }, null, 2);
async function gh(path, opts = {}) {
  const res = await fetch('https://api.github.com' + path, {
    ...opts,
    headers: { Accept: 'application/vnd.github+json', Authorization: `Bearer ${gist.token}`, ...(opts.body ? { 'Content-Type': 'application/json' } : {}) },
  });
  if (!res.ok) throw Object.assign(new Error('GitHub ' + res.status), { status: res.status });
  return res.json();
}
const gistErrorText = (e) => (e.status === 401 ? 'Токен не подходит или истёк' : e.status === 403 || e.status === 404 ? 'У токена нет доступа к Gist' : e.status ? `Ошибка GitHub ${e.status}` : 'Нет сети — копия сохранится позже');
function validBackup(data) {
  return data && data.program && Array.isArray(data.program.days) && data.program.days.length && Array.isArray(data.sessions);
}
function applyBackup(data) {
  state = { program: data.program, sessions: data.sessions, settings: data.settings || {}, draft: {} };
  for (const d of state.program.days) for (const ex of d.exercises) if (ex.rest === undefined) ex.rest = REST_DEFAULTS[ex.id] || null;
  ui.dayId = nearestDayId();
  save(); render();
}
async function syncGist(silent = true) {
  if (!gist || gistBusy) return;
  gistBusy = true;
  try {
    const body = JSON.stringify({ description: 'Workout tracker backup', public: false, files: { [GIST_FILE]: { content: backupJson() } } });
    if (gist.id) {
      try { await gh('/gists/' + gist.id, { method: 'PATCH', body }); }
      catch (e) { if (e.status === 404) gist.id = null; else throw e; }
    }
    if (!gist.id) gist.id = (await gh('/gists', { method: 'POST', body })).id;
    Object.assign(gist, { dirty: false, error: null, syncedAt: Date.now() });
    state.settings.lastBackup = Date.now();
    delete state.settings.backupSnooze;
    save();
    if (!silent) toast('Копия сохранена в Gist');
  } catch (e) {
    Object.assign(gist, { dirty: true, error: gistErrorText(e) });
    if (!silent) toast(gist.error);
  }
  saveGist();
  gistBusy = false;
  if (ui.tab !== 'workout') render();
}
function queueGist() {
  if (!gist) return;
  gist.dirty = true;
  saveGist();
  syncGist();
}
async function gistFetch() {
  const g = await gh('/gists/' + gist.id);
  const f = g.files[GIST_FILE];
  if (!f) return null;
  const data = JSON.parse(f.truncated ? await (await fetch(f.raw_url)).text() : f.content);
  return validBackup(data) ? data : null;
}
async function gistRestore(manual) {
  try {
    const data = gist.id ? await gistFetch() : null;
    if (!data) { if (manual) toast('В Gist пока нет копии'); return false; }
    const when = data.savedAt ? new Date(data.savedAt).toLocaleDateString('ru-RU', { day: 'numeric', month: 'long' }) : '';
    if (!manual && data.sessions.length <= state.sessions.length) return false;
    if (!confirm(`В Gist есть копия${when ? ' от ' + when : ''}: тренировок — ${data.sessions.length} (на этом устройстве — ${state.sessions.length}). Заменить данные на этом устройстве?`)) return false;
    applyBackup(data);
    toast('Данные восстановлены из Gist');
    return true;
  } catch (e) {
    toast(gistErrorText(e));
    return false;
  }
}
async function gistConnect() {
  const token = $('#gist-token').value.trim();
  if (!token) { toast('Вставьте токен'); return; }
  gist = { token, id: null };
  try {
    // уже есть копия с другого устройства или прошлого подключения?
    const found = (await gh('/gists?per_page=100')).find((g) => g.files && g.files[GIST_FILE]);
    if (found) gist.id = found.id;
  } catch (e) {
    toast(gistErrorText(e));
    gist = null;
    return;
  }
  saveGist();
  const restored = gist.id ? await gistRestore(false) : false;
  if (!restored) await syncGist(false);
  render();
}
addEventListener('online', () => { if (gist?.dirty) syncGist(); });

/* ---------- backup ---------- */
async function exportData() {
  const name = `workouts-${new Date().toISOString().slice(0, 10)}.json`;
  const json = JSON.stringify({ program: state.program, sessions: state.sessions, settings: state.settings }, null, 2);
  const file = new File([json], name, { type: 'application/json' });
  if (navigator.canShare?.({ files: [file] })) {
    try { await navigator.share({ files: [file] }); markBackup(); return; }
    catch (e) { if (e.name === 'AbortError') return; }
  }
  const a = document.createElement('a');
  a.href = URL.createObjectURL(file);
  a.download = name;
  a.click();
  setTimeout(() => URL.revokeObjectURL(a.href), 1000);
  markBackup();
}
function markBackup() {
  state.settings.lastBackup = Date.now();
  delete state.settings.backupSnooze;
  save(); render();
}
$('#import-file').addEventListener('change', async (ev) => {
  const file = ev.target.files[0];
  ev.target.value = '';
  if (!file) return;
  try {
    const data = JSON.parse(await file.text());
    if (!validBackup(data)) throw new Error();
    if (!confirm(`В копии ${data.sessions.length} тренировок. Заменить текущие данные?`)) return;
    applyBackup(data);
    queueGist();
    toast('Данные восстановлены');
  } catch {
    toast('Не удалось прочитать файл');
  }
});

// Секундомер тренировки: обновляем только цифры, без перерисовки
setInterval(() => {
  const el = document.getElementById('clock');
  if (!el) return;
  const started = draftStart(getDay(ui.dayId));
  if (started) el.textContent = fmtDur((Date.now() - started) / 1000);
}, 1000);

/* ---------- start ---------- */
render();
if (gist?.dirty) syncGist();
navigator.storage?.persist?.();
if ('serviceWorker' in navigator) {
  addEventListener('load', () => navigator.serviceWorker.register('./sw.js').catch(() => {}));
}
</script>
